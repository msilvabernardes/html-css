<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <hr>
    <p>Tente abrir este site em vários dispositivos diferentes ou simplesmente aumente ou diminua o tamanho no seu navegador</p>
    <hr>
    <picture>
        <source media="(max-width:750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="foto g">
    </picture>
    <hr>

    <!--AUTO significa que o audio dará play automaticamente (a depender do navegador) METADATA significa que o usuario terá que dar play mas as informações de tamanho e duração do áudio serão disponibilizadas. None nada aparecerá. -->

    <h1>Vamos aprender a inserir um áudio:</h1>
        <audio preload="auto" autoplay controls>
            <source src="midia/kuntry-boy.mp3" type="audio/mpeg">
            <source src="midia/kuntry-boy.ogg" type="audio/ogg">
            <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/kuntry-boy.mp3">Clique aqui para baixar o arquivo mp3</a></p>

        </audio>

</body>
</html>
