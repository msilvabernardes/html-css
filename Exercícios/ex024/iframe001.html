<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>

    <!--O tamanho padrão do iframe é de 300x150 px-->

    <p>
        Acessando o site do 

        <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="no"></iframe>

        para aprender a programar
    </p>

    <p>
        O repoitório do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>

        também é bem legal!
    </p>

    <p> <!--Tudo o que é colocado dentro da TAG iframe só vai aparecer se o site que vc colocou não for compatível com iframe-->
        O site do

        <iframe src="https://www.google.com.br" frameborder="0">
            <a href="https://www.google.com.br" target="_blank">google</a>
        </iframe>

        Não aceita o iframe
    </p>


</body>
</html>
